] }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
gpui-base = { path = "crates/gpui_base/" }
gpui-component-assets = { path = "crates/gpui_component_assets/" }
gpui-component-macros = { path = "crates/gpui_component_macros/" }

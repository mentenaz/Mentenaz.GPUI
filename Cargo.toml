[workspace]
resolver = "2"
members = [
    "crates/gpui",
    "crates/gpui_apple/",
    "crates/gpui_base",
    "crates/gpui_component",
    "crates/gpui_component_assets",
    "crates/gpui_component_fps",
    "crates/gpui_component_macros",
    "crates/gpui_component_story",
    "crates/gpui_flow/",
    "crates/gpui_ios",
    "crates/gpui_linux",
    "crates/gpui_macos",
    "crates/gpui_macros",
    "crates/gpui_platform",
    "crates/gpui_shared_string",
    "crates/gpui_tokio",
    "crates/gpui_util",
    "crates/gpui_web",
    "crates/gpui_wgpu",
    "crates/gpui_windows",
    "crates/http_client/",
    "crates/http_client_tls/", "crates/util","crates/app_names/"
]
[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
accesskit_unix = "0.22"
accesskit_windows = "0.34"
anyhow = "1.0.86"
async-task = "4.7"
backtrace = "0.3"
bench_metrics = { path = "crates/bench_metrics/" }
bitflags = "2.6.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
collections = { path = "crates/collections", version = "0.1.0" }
criterion = { version = "0.8.2", features = ["html_reports"] }
ctor = "1.0.12"
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from_str"] }
etagere = "0.2"
futures = "0.3.34"
futures-concurrency = "7.7.1"
gpui_macros = { path = "crates/gpui_macros/" }
gpui_shared_string = { path = "crates/gpui_shared_string/" }
gpui_util = { path = "crates/gpui_util/" }
hdrhistogram = { version = "7", default-features = false }
heapless = "0.9.2"
http_client = { path = "crates/http_client/" }
# Only the formats gpui's ImageFormat handles (SVG goes through resvg). The
# defaults also pull in OpenEXR (exr -> pulp -> paste, unmaintained) and the
# AVIF encoder (rav1e), which gpui doesn't use. No `rayon` either: gpui
# doesn't use image's parallel pixel iterators, and its weak `exr?/rayon` and
# `ravif?/threading` features make Cargo record those crates in the lock file.
image   = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "tiff",
    "ico",
    "pnm",
] }
inventory = "0.3.19"
itertools = "0.14.0"
log = { version = "0.4", default-features = false, features = ["std"] }
parking_lot = "0.12.1"
postage = { version = "0.5", default-features = false }
profiling = "1"
proptest = { version = "1.12.0", features = ["attr-macro"] }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
raw-window-handle = "0.6"
refineable = { path = "crates/refineable/" }
regex = { version = "1.5", default-features = false, features = ["std", "perf"] }
resvg = { version = "0.46.0", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images",
] }
scheduler = { path = "crates/scheduler" }
schemars = { version = "1.0", default-features = false, features = ["std", "indexmap2"] }
serde = { version = "1.0", features = ["rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "lock_api"] }
stacksafe = "1.0"
strum = { version = "0.28", features = ["derive"] }
sum_tree = { path = "crates/sum_tree" }
taffy = { version = "=0.15.0", default-features = false }
thiserror = "2.0.12"
url = "2.2"
usvg = { version = "0.46.0", default-features = false }
uuid = { version = "1.1", features = ["serde"] }
web-time = "1.1.0"
env_logger = "0.11"
gpui_platform = { path = "crates/gpui_platform/" }
unicode-segmentation = "1.10"
util_macros = { path = "crates/util_macros/" }
async-channel = { version = "2.5", default-features = false }
libc = "0.2"
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed" }
objc2-core-foundation = { version = "=0.3.2", default-features = false }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer"] }
async-tungstenite = "0.33"
smol = "2.0"
pollster = "0.4.0"
reqwest_client = { path = "crates/reqwest_client" }
wasm-bindgen = "0.2.120"
web-sys = "0.3"
objc2 = "0.6"
# windows   = "0.62.2"
perf-event = { package = "perf-event2", version = "0.7.4" }
indexmap = { version = "2.7.0", features = ["serde"] }
rustc-hash = "2.1.0"
which = "8"
heck = "0.5"
proc-macro2 = "1.0.93"
quote = "1.0.9"
syn = { version = "2.0", default-features = false, features = ["proc-macro"] }
gpui = { path = "crates/gpui/" }
rustls = "0.23.26"
rustls-platform-verifier = "0.7"
webpki-roots = "1.0.10"
derive_refineable = { path = "crates/refineable/derive_refineable" }
flume = { version = "0.12", default-features = false, features = ["async"] }
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", version = "0.3", features = ["es_modules"] }
rayon = "1.8"
tracing = "0.1.40"
ztracing = { path = "crates/ztracing" }
zlog = { path = "crates/zlog" }
tracing-subscriber = "0.3"
ztracing_macro = { path = "crates/ztracing_macro" }
js-sys = "0.3"
tempfile = "3.20.0"
gpui_linux = { path = "crates/gpui_linux/" }
console_error_panic_hook = "0.1.7"
gpui_web = { path = "crates/gpui_web/" }
gpui_ios = { path = "crates/gpui_ios/" }
gpui_wgpu = { path = "crates/gpui_wgpu/" }
gpui_macos = { path = "crates/gpui_macos/" }
gpui_windows = { path = "crates/gpui_windows/" }
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "inhibit",
    "open_uri",
    "file_chooser",
    "settings"
] }
bytemuck = "1"
notify-rust = "4"
oo7 = { version = "0.6", default-features = false }
xkbcommon = { version = "0.8", default-features = false }
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", default-features = false }
swash = "0.2.6"
unicode-bidi = { version = "0.3.18", default-features = false, features = [
    "hardcoded-data",
] }
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "3b3506ea31154edc04de64debda0e780cba2639c", default-features = false }
unicode-script = "0.5.7"
wasm-bindgen-futures = "0.4"
block2 = "0.6"
gpui_apple = { path = "crates/gpui_apple/" }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",

[package]
description = "UI components for building fantastic desktop application by using GPUI."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license = "Apache-2.0"
name = "gpui-component"
documentation = "https://docs.rs/gpui-component"
homepage = "https://longbridge.github.io/gpui-component"
repository = "https://github.com/longbridge/gpui-component"
version = "0.5.2"
publish = true
edition.workspace = true

[lib]
doctest = false

[features]
decimal = ["dep:rust_decimal"]
inspector = ["gpui_macros/inspector", "gpui/inspector", "gpui-base/inspector"]
# Declared but not wired to a dependency: gates highlighter.rs/languages.rs/
# registry.rs, which need an actual tree_sitter dependency + grammars to
# enable for real. Left off (the wasm_stub no-op highlighter is always used)
# until that's built out; declaring it here just stops the unexpected-cfg
# warning on the existing `#[cfg(feature = "tree-sitter")]` gates.
tree-sitter = []

[dependencies]
anyhow.workspace = true
gpui = { workspace = true }
gpui_macros.workspace = true
gpui-base.workspace = true
gpui-component-macros = { workspace = true }
# This regular dependency propagates the canonical icon directory from the
# assets build script into this crate's build script through Cargo DEP metadata.
gpui-component-assets = { workspace = true }
notify.workspace = true
ropey.workspace = true
rust-i18n.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
smallvec.workspace = true
sum-tree.workspace = true
tracing.workspace = true
log.workspace = true

enum-iterator = "2.1.0"
itertools = "0.13.0"
once_cell = "1.19.0"
paste = "1"
uuid = "1.10"

# Async primitives (cross-platform, including WASM)
futures = "0.3"

# Chart
num-traits = "0.2"
rust_decimal = { version = "1.37.0", optional = true }

# Markdown Parser
markdown = { version = "1.0.0", features = ["serde"] }

# HTML Parser
html5ever = "0.27"
markup5ever_rcdom = "0.3.0"

# Calendar
chrono = "0.4.38"

# Code Editor
lsp-types.workspace = true

# Cross-platform time APIs (zero-cost on native, uses web APIs on WASM)
instant.workspace = true

# Native-only dependencies (not available on WASM)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=21.0.0"
# Native menu (NativeMenu) — drives AppKit NSMenu via objc2.
raw-window-handle = { workspace = true }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSMenu",
    "NSMenuItem",
    "NSView",
    "NSWindow",
    "NSResponder",
    "NSEvent",
    "NSImage",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Native menu (NativeMenu) — drives Win32 popup menus.
raw-window-handle = { workspace = true }
resvg = "0.45.1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
indoc = "2"

[package.metadata.cargo-machete]
ignored = ["gpui_macros"]
